<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>multiTick · 틱밀도 비교</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header>
  <b>multiTick</b>
  <nav>
    <button class="tab on" data-tab="import">성과검증 불러오기</button>
    <button class="tab" data-tab="chart">밀도 차트</button>
  </nav>
</header>

<section id="tab-import" class="tab-body on">
  <div class="row">
    <label>검색일자 <input type="date" id="baseDate"></label>
    <label>검색시각 <input type="time" id="baseTime" value="09:02"></label>
    <label>조건식 <input id="condition" placeholder="다량어"></label>
    <label>틱캔들
      <select id="tickMul">
        <option value="1">30틱</option><option value="2">60틱</option>
        <option value="4">120틱</option><option value="8">240틱</option>
        <option value="12">360틱</option><option value="16">480틱</option>
        <option value="24" selected>720틱</option>
      </select>
    </label>
    <label>단위구간
      <select id="bucketSec">
        <option value="60">1분</option><option value="180">3분</option>
        <option value="300">5분</option><option value="900" selected>15분</option>
      </select>
    </label>
    <label>슬롯/구간 <input type="number" id="slots" value="20" min="4" max="120"></label>
  </div>

  <textarea id="paste" rows="9"
    placeholder="[1516] 성과검증 → 검색 종목 리스트를 복사해서 여기에 붙여넣으세요"></textarea>

  <div class="row">
    <button id="btnParse" class="primary">변환</button>
    <button id="btnSave">파일로 저장</button>
    <button id="btnToChart">차트로 보내기</button>
    <span id="msg"></span>
  </div>

  <div id="preview"></div>
</section>

<section id="tab-chart" class="tab-body">
  <div class="row">
    <select id="wlPick"></select>
    <label>틱캔들 <select id="cTickMul"></select></label>
    <label>단위구간 <select id="cBucket"></select></label>
    <label>슬롯 <input type="number" id="cSlots" value="20" min="4" max="120"></label>
    <label>구간범위 <select id="cWindow">
      <option value="1800">30분</option>
      <option value="3600" selected>1시간</option>
      <option value="7200">2시간</option>
      <option value="14400">4시간</option>
      <option value="0">전체(09:00~15:30)</option>
    </select></label>
    <label>축 <select id="cMode">
      <option value="time" selected>시간축(비교)</option>
      <option value="tick">틱축(정독)</option>
      <option value="pane">분할패널(키움식)</option>
    </select></label>


    <label>측정 <select id="mode">
      <option value="v1">v1 · 고정 시간창 (원본)</option>
      <option value="v2">v2 · 돌파 앵커</option>
      <option value="v3">v3 · 돌파 게이트 + 밀도</option>
      <option value="v4" selected>v4 · 돌파 이벤트</option>
      <option value="both">v1 + v4 비교</option>
    </select></label>


    <label><input type="checkbox" id="cLabel" checked> 개수 라벨</label>
    <button id="btnDraw" class="primary">그리기</button>
    <button id="btnGolden" title="현재 결과를 data/golden 비교용 JSON으로 저장">기준결과 저장</button>
    <span id="cmsg"></span>
  </div>

  <div class="split">
    <aside id="picker"></aside>
    <div id="chart"></div>
  </div>

  <!-- ▼ 결과 패널 ▼ -->
  <div class="row" id="corrRow">
    <span id="corr"></span>
    <span id="frozenBadge"></span>
  </div>
  <div id="panels"></div>
  <div id="events"></div>

  <div id="panels"></div>
  <div id="events"></div>
</section>



<script type="module" src="/app.js"></script>
</body>
</html>
